name: Local Pipeline Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  test-connection:
    name: Control My Laptop
    runs-on: self-hosted

    steps:
      - name: Create a Text File on Desktop
        shell: pwsh
        run: |
          echo "SUCCESS! GitHub Actions commanded my laptop from the cloud!" | Out-File -FilePath "$env:USERPROFILE\Desktop\Pipeline_Proof.txt"

      - name: Open Windows Calculator
        shell: pwsh
        run: Start-Process calc.exe
