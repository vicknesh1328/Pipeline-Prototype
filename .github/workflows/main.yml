name: Local Pipeline Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  test-connection:
    name: Control My Laptop
    runs-on: self-hosted

    steps:
      - name: Create Proof File
        shell: cmd
        run: echo Connection-Successful > proof.txt

      - name: Read the File Back
        shell: cmd
        run: type proof.txt
